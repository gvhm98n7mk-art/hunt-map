name: Refresh calendar
on:
  schedule: [{cron: "17 */6 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install icalendar recurring-ical-events
      - run: python fetch_calendar.py
        env: {CAL_URL: "${{ secrets.CAL_URL }}"}
      - run: |
          git config user.name "calendar-bot"; git config user.email "bot@users.noreply.github.com"
          git add calendar.json; git diff --cached --quiet || git commit -m "calendar refresh"; git push
